<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <title>
        Aloha Nails
    </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff5f8;
            text-align: center;
        }

        .gallery img {
            width: 250px;
            margin: 10px;
            border-radius: 10px;
        }

        *{
            box-sizing: border-box;
        }

        .mySlides{
            min-width: 450px;
        }
        
        .mySlides img {
            width: 100%;
            display: block;
        }

        img {
            vertical-align: middle;
        }

        /*Slideshow Container*/
        .slideshow-container{
            max-width: 450px;
            max-height: 450px;
            overflow: hidden;
            position: relative;
            margin:auto;
        }

        .slide-track{
            display: flex;
            transition: transform 0.5s ease-in-out;
        }


        /*Next and Previous buttons*/
        .prev, .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            width: 44px;
            height: 44px;

            line-height: 44px;   
            text-align: center;

            background-color: rgba(0,0,0,0.6);
            color: white;
            font-size: 20px;

            border-radius: 50%;
            cursor: pointer;
            user-select: none;
            z-index: 10;
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }


        /* On hover, add a black background color with a little bit see-through */
        .prev:hover, .next:hover {
        background-color: rgba(0,0,0,0.8);
        }

        body {
    margin: 0; /* Resets default browser margins */
    font-family: sans-serif;
    }

    .site-header {
        background-color: #333; /* Dark background for the bar */
        color: white;
        padding: 10px 20px; /* Some padding around the content */
        display: flex; /* Enables Flexbox layout */
        justify-content: space-between; /* Puts space between the logo and nav */
        align-items: center; /* Vertically centers items */
        overflow: hidden; /* Clears any floats if used */
    }

    .site-header .logo {
        color: white;
        text-decoration: none;
        font-size: 1.5em;
        font-weight: bold;
    }

    .main-nav ul {
        list-style-type: none; /* Removes bullet points */
        margin: 0;
        padding: 0;
        display: flex; /* Makes list items sit side-by-side */
    }

    .main-nav li a {
        color: white;
        text-decoration: none;
        padding: 14px 16px;
        display: block; /* Makes the entire link area clickable */
        text-align: center;
    }

    .main-nav li a:hover {
        background-color: #555; /* Changes color on hover */
    }

    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Bar Example</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <a href="/" class="logo">My Website</a>
        <nav class="main-nav">
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#news">News</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
    </header>
    <h1>Aloha Nails</h1>

    <div class="slideshow-container">

        <div class = "slide-track" id = "slideTrack">
            <div class="mySlides">
            <img src="images/Umapyoi_densetsu.png">
            </div>

            <div class="mySlides">
            <img src="images/Umiyuri_kaiteitan.png">
            </div>

        </div>


        <a class="prev" onclick="prevSlide()">❮</a>
        <a class="next" onclick="nextSlide()">❯</a>


<script>
const track = document.getElementById("slideTrack");
const slides = document.querySelectorAll(".mySlides");
const slideWidth = 450;

let index = 0;

// Clone first slide and append it
const firstClone = slides[0].cloneNode(true);
track.appendChild(firstClone);

const totalSlides = slides.length + 1;

function updateSlide(animated = true) {
    if (animated) {
        track.style.transition = "transform 0.5s ease-in-out";
    } else {
        track.style.transition = "none";
    }
    track.style.transform = `translateX(-${index * slideWidth}px)`;
}

function nextSlide() {
    index++;
    updateSlide(true);

    if (index === totalSlides - 1) {
        setTimeout(() => {
            index = 0;
            updateSlide(false);
        }, 500);
    }
}

function prevSlide() {
    if (index === 0) {
        index = totalSlides - 1;
        updateSlide(false);

        setTimeout(() => {
            index = totalSlides - 2;
            updateSlide(true);
        }, 20);
    } else {
        index--;
        updateSlide(true);
    }
}
</script>


    </div>
</body>
</html>
